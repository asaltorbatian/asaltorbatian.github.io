<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page Not Found | Asal Torbatian</title>
  <link rel="icon" type="image/webp" href="/Images/favicon.webp">
  <link rel="preload" href="/Resources/fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/Resources/unicons.css">
  <style>
    @font-face { font-family: 'Poppins'; font-style: normal; font-weight: 400; font-display: swap; src: url('/Resources/fonts/poppins-400.woff2') format('woff2'); }
    @font-face { font-family: 'Poppins'; font-style: normal; font-weight: 600; font-display: swap; src: url('/Resources/fonts/poppins-600.woff2') format('woff2'); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: #0a0c0f; color: #d6d4dc; font-family: 'Poppins', sans-serif; text-align: center; }
    main { width: min(100%, 640px); padding: clamp(2rem, 7vw, 4.5rem); border: 1px solid #2d2c39; border-radius: 1.5rem; background: #111218; }
    .code { color: #e90854; font-size: clamp(4rem, 18vw, 8rem); font-weight: 600; line-height: 1; }
    h1 { margin: 1rem 0 .75rem; color: #fff; font-size: clamp(1.65rem, 5vw, 2.5rem); }
    p { margin: 0 auto 2rem; max-width: 46ch; line-height: 1.7; }
    a { display: inline-flex; align-items: center; gap: .5rem; min-height: 48px; padding: .8rem 1.2rem; border-radius: .75rem; background: #e90854; color: #fff; font-weight: 600; text-decoration: none; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1>Page not found</h1>
    <p>The page may have moved or the address may be incorrect. Return to the portfolio to continue browsing.</p>
    <a href="/"><i class="uil uil-arrow-left" aria-hidden="true"></i> Back to homepage</a>
  </main>
</body>
</html>
